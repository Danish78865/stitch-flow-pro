[build]
builder = "nixpacks"

[deploy]
startCommand = "python init_db.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/docs"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[mounts]]
source = "/data"
destination = "/app/data"
