version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./stitchflow.db
      - SECRET_KEY=stitch-flow-pro-production-secret-key
      - ENVIRONMENT=production
    volumes:
      - ./stitchflow.db:/app/stitchflow.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./static:/usr/share/nginx/html/static
      - ./*.html:/usr/share/nginx/html/
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: stitchflow-network
